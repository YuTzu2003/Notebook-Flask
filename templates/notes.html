<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筆記轉移 - PDF做筆記</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/jquery-easy-loading@1.3.0/dist/jquery.loading.min.css" rel="stylesheet">
    <link rel="icon" href="/static/logo.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="/static/css/mapping.css">
</head>

<body>
    {% include 'navbar.html' %}

    <div class="container" style="margin-top: 90px;">

        <!-- 上方操作區 -->
        <div class="card border-0 shadow-sm rounded-3 mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-1">程式筆記轉移</h5>
                <p class="text-muted small mb-4">請選擇舊版與新版癌登手冊 系統將自動比對頁面並調整標註位置</p>

                <form id="migrateForm" enctype="multipart/form-data">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label fw-bold text-secondary">選擇版本比對</label>
                            <select class="form-select" name="mapping_id" required>
                                <option value="" disabled selected>請選擇版本比對紀錄...</option>
                                {% for row in mapping_history %}
                                    <option value="{{ row.RecordID }}">
                                        版本: v{{ row.OldVersion }} → 版本: v{{ row.NewVersion }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-5">
                            <label class="form-label fw-bold text-secondary">XFDF</label>
                            <input type="file" class="form-control" name="xfdf" accept=".xfdf" required>
                        </div>

                        <div class="col-md-2">
                            <button type="button" class="btn btn-danger w-100" onclick="runMigrate()">開始轉移</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-easy-loading@1.3.0/dist/jquery.loading.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        async function runMigrate(){
            let form=document.getElementById("migrateForm")
            let formData=new FormData(form)

            $("body").loading({message:"筆記轉移中..."})

            try{
                let res=await fetch("/annotation/migrate", {method:"POST", body:formData})
                let data=await res.json()
                $("body").loading("stop")

                if(data.status==="success"){
                    Swal.fire({
                        icon:"success",
                        title:"轉移完成",
                        confirmButtonText:"下載檔案"
                    }).then(()=>{
                        window.location.href = "/static/pdf_xfdf/" + data.filename
                    })                
                } else {
                    Swal.fire({icon:"error", title:"轉移失敗"})
                }
            } catch(e){
                $("body").loading("stop")
                Swal.fire({icon:"error", title:"系統錯誤"})
            }
        }

        // 顯示 Flash Messages
        const flashMessages = JSON.parse('{{ get_flashed_messages(with_categories=true)|tojson|safe }}');
        flashMessages.forEach(([category, message]) => {
            Swal.fire({icon: category === 'success' ? 'success' : 'error', title: message, showConfirmButton:false, timer:1500});
        });
    </script>
</body>
</html>
