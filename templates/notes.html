<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>筆記轉移 - PDF做筆記</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/jquery-easy-loading@1.3.0/dist/jquery.loading.min.css" rel="stylesheet" />
    <link rel="icon" href="/static/logo.ico" type="image/x-icon"/>
</head>

<body>

{% include 'navbar.html' %}

<div class="container" style="margin-top: 90px;">

    <div class="card border-0 shadow-sm rounded-3 mb-4">
        <div class="card-body p-4">

            <h5 class="fw-bold mb-1">PDF 筆記轉移</h5>
            <p class="text-muted small mb-4">將舊版 PDF 的註解轉移到新版 PDF</p>

            <form id="migrateForm" enctype="multipart/form-data">

                <div class="row g-3 align-items-end">

                    <div class="col-md-3">
                        <label class="form-label fw-bold text-secondary">舊版 PDF</label>
                        <input type="file" class="form-control" name="old_pdf" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-bold text-primary">新版 PDF</label>
                        <input type="file" class="form-control" name="new_pdf" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-bold text-secondary">XFDF</label>
                        <input type="file" class="form-control" name="xfdf" required>
                    </div>

                    <div class="col-md-2">
                        <label class="form-label fw-bold text-secondary">mapping.csv</label>
                        <input type="file" class="form-control" name="mapping" required>
                    </div>

                    <div class="col-md-2">
                        <button type="button" class="btn btn-primary w-100" onclick="runMigrate()">
                            開始轉移
                        </button>
                    </div>

                </div>

            </form>

        </div>
    </div>

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery-easy-loading@1.3.0/dist/jquery.loading.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


<script>

async function runMigrate(){

    let form = document.getElementById("migrateForm")
    let formData = new FormData(form)

    $("body").loading({
        message: "筆記轉移中..."
    })

    try{

        let res = await fetch("/annotation/migrate",{
            method:"POST",
            body:formData
        })

        let data = await res.json()

        $("body").loading("stop")

        if(data.status === "success"){

            Swal.fire({
                icon:"success",
                title:"轉移完成",
                showConfirmButton:false,
                timer:1500
            })

        }else{

            Swal.fire({
                icon:"error",
                title:"轉移失敗"
            })

        }

    }catch(e){

        $("body").loading("stop")

        Swal.fire({
            icon:"error",
            title:"系統錯誤"
        })

    }

}

</script>

</body>
</html>
