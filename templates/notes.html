<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>筆記轉移 - PDF做筆記</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/jquery-easy-loading@1.3.0/dist/jquery.loading.min.css" rel="stylesheet">
    <link rel="icon" href="/static/logo.ico" type="image/x-icon"/>
    <link rel="stylesheet" href="/static/css/mapping.css"> 
</head>
<body>
    {% include 'navbar.html' %}

    <div class="container" style="margin-top: 90px;">
        <div class="card border-0 shadow-sm rounded-3 mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-1">PDF筆記轉移</h5>
                <p class="text-muted small mb-4">請選擇版本比對紀錄，以及上傳含有筆記的舊版PDF，進行轉移</p>

                <form id="migrateForm" enctype="multipart/form-data">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label fw-bold">選擇版本比對紀錄</label>
                            <select class="form-select" name="mapping_id" required>
                                <option value="" disabled selected>請選擇...</option>
                                {% for row in mapping_history %}
                                    <option value="{{ row.RecordID }}">
                                        v{{ row.OldVersion }} → v{{ row.NewVersion }} 
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-5">
                            <label class="form-label fw-bold">含有筆記的舊PDF</label>
                            <input type="file" class="form-control" name="old_pdf" accept=".pdf" required>
                        </div>

                        <div class="col-md-2">
                            <button type="button" class="btn btn-primary w-100" onclick="runMigrate()">開始轉移</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-3">
    <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 text-secondary">筆記轉移紀錄</h5>              
        <form method="GET" action="/notes" class="d-flex align-items-center m-0 gap-2">
            <label for="sort_by" class="form-label mb-0 text-muted small">排序方式</label>
            <select name="sort_by" id="sort_by" class="form-select form-select-sm" style="width: auto;" onchange="this.form.submit()">
                <option value="SourceFileName" {% if current_sort == 'SourceFileName' %}selected{% endif %}>檔名</option>
                <option value="Version" {% if current_sort == 'Version' %}selected{% endif %}>版本</option>
                <option value="CreateTime" {% if current_sort == 'CreateTime' %}selected{% endif %}>轉移時間</option>                  
            </select>
        </form>
    </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">參考基準版本</th>
                                <th>含有筆記的舊PDF名稱</th>
                                <th>轉移時間</th>
                                <th class="text-end pe-4" style="width: 20%;"></th>
                            </tr>
                        </thead>

                        <tbody>
                            {% for row in history %}
                            <tr>
                                <td class="ps-4">
                                    <span class="badge bg-success-subtle text-success border border-secondary border-opacity-25 fw-normal">
                                        {{ row.OldV }} → {{ row.NewV }}
                                    </span>
                                </td>
                                
                                <td class="filename">
                                    <div class="d-flex align-items-center">
                                        <i class="far fa-file-pdf text-danger me-2 fs-5 opacity-75"></i>
                                        <span class="fw-bold text-dark">{{ row.SourceFileName }}</span>
                                    </div>
                                </td>

                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <span class="text-muted small font-monospace">{{ row.CreateTime.strftime('%Y-%m-%d') }}</span>
                                    </div>
                                </td>

                                <td class="text-end pe-4">
                                    <div class="d-flex align-items-center justify-content-end gap-2">
                                        <a href="/download_pdf/{{ row.ResultName }}" class="btn btn-sm btn-outline-dark">下載</a>
                                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteNote('{{ row.TransferID }}')">刪除</button>
                                    </div>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="4" class="text-center py-5 text-muted small">
                                    目前尚無任何轉移紀錄
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-easy-loading@1.3.0/dist/jquery.loading.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/notes.js"></script>
</body>
</html>
