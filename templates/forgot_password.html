<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>忘記密碼 - PDF做筆記</title><link href="/static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/static/css/login.css"></head>
<body><div class="login-wrapper"><div class="card animate-fade-in"><div class="card-header"><div class="app-branding"><img src="/static/logo.png" alt="logo"><span>PDF做筆記</span></div><p class="text-muted small mb-0">輸入帳號後，系統會將驗證碼寄至已綁定的 Email。</p></div><div class="card-body">
<form method="post"><div class="form-floating mb-4"><input type="text" class="form-control" id="user_id" name="user_id" placeholder="帳號" required autocomplete="username"><label for="user_id">帳號</label></div><div class="d-grid"><button type="submit" class="btn btn-dark">寄送驗證碼</button></div></form>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ 'alert-success' if category == 'success' else 'alert-danger' }} mt-4 py-2">{{ message }}</div>{% endfor %}{% endwith %}
<div class="text-center mt-3"><a class="small text-secondary" href="{{ url_for('auth.login') }}">返回登入</a></div></div></div><div class="footer-text">&copy; 2026 NFU. All rights reserved.</div></div></body></html>
